<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="赤ペンノート">
<meta name="theme-color" content="#f5f7f8">
<title>赤ペン読書ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a notebook page; tabs pinned to the bottom; the entry editor slides over as a full sheet. */
:root{
  --paper:#f5f7f8; --sheet:#ffffff; --ink:#1d2a3a; --ink-soft:#5b6878; --rule:#d9dfe5;
  --shu:#d0442b; --shu-soft:#f6ddd6; --grid:#eab8ab; --ok:#2f7d5b; --warn:#a46a00;
  --st-0:#e7ebef; --st-1:#f3d9a4; --st-2:#9cc8e6; --st-3:#2f7d5b;
  --f-head:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-pen:"Klee One","Zen Kaku Gothic New",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131a23; --sheet:#1b2430; --ink:#e6ebf1; --ink-soft:#9aa7b6; --rule:#2e3a49;
  --shu:#ff7a5c; --shu-soft:#3a2420; --grid:#6b3a30; --ok:#5fc497; --warn:#e2b04a;
  --st-0:#28323f; --st-1:#6b5422; --st-2:#2f5d7d; --st-3:#3f9a73; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131a23; --sheet:#1b2430; --ink:#e6ebf1; --ink-soft:#9aa7b6; --rule:#2e3a49;
  --shu:#ff7a5c; --shu-soft:#3a2420; --grid:#6b3a30; --ok:#5fc497; --warn:#e2b04a;
  --st-0:#28323f; --st-1:#6b5422; --st-2:#2f5d7d; --st-3:#3f9a73; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-head);font-weight:700;line-height:1.35;text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 120px}
.muted{color:var(--ink-soft)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--shu);border-color:var(--shu);color:#fff;font-weight:700}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--shu);border-color:var(--shu)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice{padding:10px 12px;margin-bottom:12px;border-radius:10px;background:var(--shu-soft);font-size:14px}
.notice[data-kind="info"]{background:var(--st-0)}
label.f{display:block;font-weight:700;margin-bottom:4px}
.field{display:grid;gap:4px}
input[type=text],input[type=number],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
textarea{min-height:88px;resize:vertical;line-height:1.7}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sheet);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{min-height:56px;border:0;background:none;font-size:13px;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabs button[aria-selected="true"]{color:var(--shu);font-weight:700}
nav.tabs .badge{font-size:11px;background:var(--shu);color:#fff;border-radius:99px;padding:0 6px;min-width:18px}

/* notes */
.bookhead{display:grid;gap:6px;margin-bottom:12px}
.bookhead select{font-family:var(--f-head);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-head);font-size:22px;font-variant-numeric:tabular-nums}
.next{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px;border-radius:14px;background:var(--ink);color:var(--paper);border:0;width:100%;text-align:left;min-height:64px}
.next .no{font-family:var(--f-head);font-size:20px}
.board{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:3px;margin:16px 0}
.cell{aspect-ratio:1;border-radius:3px;background:var(--st-0);border:0;padding:0;position:relative;max-width:100%}
.cell[data-s="記入中"]{background:var(--st-1)}
.cell[data-s="読了"]{background:var(--st-2)}
.cell[data-s="定着"]{background:var(--st-3)}
.cell.due{box-shadow:inset 0 0 0 2px var(--shu)}
.cell.star::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink-soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.chip{min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--rule);background:var(--sheet);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.list{display:grid;border-top:1px solid var(--rule)}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:10px 4px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;min-height:48px}
.item .no{font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.item .c{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--st-0);white-space:nowrap}
.pill[data-s="記入中"]{background:var(--st-1)}
.pill[data-s="読了"]{background:var(--st-2)}
.pill[data-s="定着"]{background:var(--st-3);color:#fff}

/* shelf */
.book{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:14px;display:grid;gap:8px}
.book h3{font-size:17px}
.bar{height:6px;border-radius:99px;background:var(--st-0);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok)}
.stack{display:grid;gap:12px}

/* editor */
#editor{position:fixed;inset:0;z-index:10;background:var(--paper);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.ehead{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--rule)}
.ehead .in{max-width:640px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px}
.ehead .t{flex:1;min-width:0;text-align:center}
.ehead .t b{font-family:var(--f-head);font-size:18px}
.save{font-size:12px;color:var(--ink-soft)}
.save[data-s="err"]{color:var(--shu);font-weight:700}
.sec>*,.stack>*,.field>*{min-width:0}
.sec{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding-block:18px;border-bottom:1px dashed var(--rule)}
.sec h2{font-size:17px;display:flex;gap:8px;align-items:baseline}
.sec h2 .step{font-family:var(--f-head);color:var(--shu)}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:var(--st-0);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .p{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:0 6px;border-radius:6px}
.ph .x{position:absolute;right:2px;top:2px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:16px}
.ph .x.arm{background:var(--shu)}
.drop{border:2px dashed var(--rule);border-radius:12px;padding:12px;text-align:center}
.drop.over{border-color:var(--shu)}
.alt{margin-top:10px;text-align:left;font-size:14px}
.alt summary{min-height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:pointer}
.native{width:100%;min-height:44px;font-size:16px}
.pastebox{min-height:72px;border:1px dashed var(--ink-soft);border-radius:10px;padding:10px;background:var(--sheet);font-size:16px;overflow:hidden;max-height:120px}
.pastebox:empty::before{content:"ここを長押しして「ペースト」";color:var(--ink-soft)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;font-size:100px;cursor:pointer}
.count{font-variant-numeric:tabular-nums;font-size:14px}
.count[data-s="under"]{color:var(--ink-soft)}
.count[data-s="over"]{color:var(--shu);font-weight:700}
.count[data-s="ok"]{color:var(--ok);font-weight:700}
.genko{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));border-top:1px solid var(--grid);border-left:1px solid var(--grid);max-width:420px}
.genko span{aspect-ratio:1;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);display:flex;align-items:center;justify-content:center;font-family:var(--f-head);font-size:clamp(11px,3.6vw,16px);position:relative;background:var(--sheet)}
.genko span.mark::after{content:"";position:absolute;right:-1px;top:15%;bottom:15%;border-right:3px solid var(--shu)}
.genko span.over{background:var(--shu-soft);color:var(--shu)}

/* red pen */
.pen{font-family:var(--f-pen);color:var(--shu);background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px;display:grid;gap:8px;position:relative}
.pen .basis{font-family:var(--f-body);font-size:12px;color:var(--ink-soft)}
.stamp{width:64px;height:64px;border:3px solid var(--shu);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-head);font-size:34px;font-weight:700;transform:rotate(-8deg);float:right;margin:0 0 4px 8px}
.pen dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.pen dt{font-weight:600}
.pen dd{margin:0;color:var(--ink)}
.pen .mk{font-size:20px;line-height:1}
.stale{font-family:var(--f-body);font-size:13px;background:var(--st-1);color:var(--ink);padding:6px 10px;border-radius:8px}
.thinking{font-family:var(--f-pen);color:var(--shu)}

/* review */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:18px;display:grid;gap:12px}
.card .concept{font-family:var(--f-head);font-size:26px}
.answer{border-left:3px solid var(--shu);padding-left:12px;display:grid;gap:6px}
.howto ol{padding-left:1.4em;margin:0;display:grid;gap:6px}
.howto section{display:grid;gap:8px;margin-bottom:22px}
@media (prefers-reduced-motion:no-preference){#editor{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>
</head>
<body>

<div class="wrap">
  <div id="globalMsg" class="notice" hidden></div>
  <main id="view"></main>
</div>

<nav class="tabs" role="tablist" aria-label="画面">
  <button role="tab" data-tab="shelf" id="tab-shelf">本棚</button>
  <button role="tab" data-tab="notes" id="tab-notes">ノート</button>
  <button role="tab" data-tab="review" id="tab-review">今日の復習 <span class="badge" id="dueBadge" hidden></span></button>
  <button role="tab" data-tab="howto" id="tab-howto">使い方</button>
</nav>

<section id="editor" hidden aria-label="記入画面"></section>

<script>
(() => {
"use strict";
const MIN = 45, MAX = 65, MAX_PHOTOS = 4, COLS = 13, ROWS = 5;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad3 = n => String(n).padStart(3, "0");
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const strip = s => String(s || "").replace(/[\s　]/g, "");
const countChars = s => Array.from(strip(s)).length;
const clip = (s, n) => Array.from(String(s ?? "")).slice(0, n).join("");

/* ---------- capabilities ---------- */
const C = { sample: false };
const state = { books: {}, entries: {}, current: null, tab: "notes", filter: "all", editing: null, ready: false, reviewIdx: 0, reviewShown: false };
const blobCache = new Map();
const stored = new Set();

function msg(text, kind) {
  const el = $("#globalMsg");
  if (!text) { el.hidden = true; return; }
  el.textContent = text; el.dataset.kind = kind || ""; el.hidden = false;
}

/* ---------- store (IndexedDB in this browser) ---------- */
const LS = "akapen-note-v1";
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("akapen-note", 1);
    r.onupgradeneeded = () => { const d = r.result; for (const n of ["books", "entries", "photos"]) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = async (name, mode, fn) => { const d = await open(); return new Promise((res, rej) => {
    const t = d.transaction(name, mode); const req = fn(t.objectStore(name));
    t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }); };
  return {
    get: (n, k) => run(n, "readonly", s => s.get(k)),
    put: (n, k, v) => run(n, "readwrite", s => s.put(v, k)),
    del: (n, k) => run(n, "readwrite", s => s.delete(k)),
    all: async n => { const d = await open(); return new Promise((res, rej) => {
      const out = {}; const t = d.transaction(n); const c = t.objectStore(n).openCursor();
      c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
    }); }
  };
})();
const DEFAULT_BOOK = { id: "b151", title: "天才科学者はこう考える 読むだけで頭がよくなる151の視点", author: "", count: 151 };
const store = {
  async load() {
    const books = await idb.all("books"), entries = await idb.all("entries");
    if (!Object.keys(books).length) {
      const b = { ...DEFAULT_BOOK, createdAt: new Date().toISOString(), lastOpenedAt: new Date().toISOString() };
      await idb.put("books", b.id, b); books[b.id] = b;
    }
    return { books, entries };
  },
  putBook: b => idb.put("books", b.id, { ...b }),
  delBook: id => idb.del("books", id),
  putEntry: (key, e) => idb.put("entries", key, JSON.parse(JSON.stringify(e))),
  delEntry: key => idb.del("entries", key)
};

/* ---------- entry helpers ---------- */
const keyOf = (bookId, no) => bookId + "_" + pad3(no);
function blankEntry(bookId, no) {
  return { bookId, no, concept: "", guess: "", readAt: null, star: false, photos: [], summary: "", memo: "",
    feedback: null, attempts: 0, modelExample: null, stage: 0, nextReview: null, lastReview: null, updatedAt: null };
}
function getEntry(bookId, no) { return state.entries[keyOf(bookId, no)] || blankEntry(bookId, no); }
function hasContent(e) { return !!(e && (e.concept || e.guess || e.summary || e.memo || (e.photos && e.photos.length) || e.readAt || e.star)); }
function statusOf(e) { if (!hasContent(e)) return "未記入"; if (e.stage >= 2) return "定着"; if (e.readAt) return "読了"; return "記入中"; }
const isDue = e => !!(e && e.nextReview && e.nextReview <= today());
function bookStats(b) {
  let read = 0, stars = 0, due = 0;
  for (let n = 1; n <= b.count; n++) { const e = state.entries[keyOf(b.id, n)]; if (!e) continue; if (e.readAt) read++; if (e.star) stars++; if (isDue(e)) due++; }
  return { read, stars, due };
}
function nextUnread(b) { for (let n = 1; n <= b.count; n++) { const e = state.entries[keyOf(b.id, n)]; if (!e || !e.readAt) return n; } return null; }
function allDue() {
  return Object.values(state.entries).filter(e => isDue(e) && state.books[e.bookId])
    .sort((a, b) => (a.nextReview < b.nextReview ? -1 : a.nextReview > b.nextReview ? 1 : (a.bookId + a.no > b.bookId + b.no ? 1 : -1)));
}

/* ---------- saving ---------- */
let saveTimer = null, saveState = "saved";
function setSave(s) {
  saveState = s;
  const el = $("#saveState"); if (!el) return;
  el.dataset.s = s;
  el.textContent = { dirty: "未保存", saving: "保存中…", saved: "保存済み", err: "保存できませんでした" }[s];
}
async function saveEntryNow(e) {
  clearTimeout(saveTimer); saveTimer = null;
  const key = keyOf(e.bookId, e.no);
  e.updatedAt = new Date().toISOString();
  state.entries[key] = e;
  setSave("saving");
  try {
    if (hasContent(e) || e.feedback || stored.has(key)) { await store.putEntry(key, e); stored.add(key); }
    setSave("saved");
  } catch (err) {
    try { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); await store.putEntry(key, e); stored.add(key); setSave("saved"); }
    catch { setSave("err"); }
  }
}
function scheduleSave(e) { setSave("dirty"); clearTimeout(saveTimer); saveTimer = setTimeout(() => saveEntryNow(e), 700); }

/* ---------- render: tabs ---------- */
function setTab(t) {
  state.tab = t;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t ? "true" : "false"));
  try { localStorage.setItem(LS + "-tab", t); } catch {}
  render();
}
function updateBadge() {
  const n = allDue().length, el = $("#dueBadge");
  el.hidden = n === 0; el.textContent = n;
}
function render() {
  updateBadge();
  const v = $("#view");
  if (!state.ready) { v.innerHTML = '<p class="muted">読み込み中…</p>'; return; }
  if (state.tab === "shelf") v.innerHTML = shelfHTML();
  else if (state.tab === "notes") v.innerHTML = notesHTML();
  else if (state.tab === "review") v.innerHTML = reviewHTML();
  else v.innerHTML = howtoHTML();
}

/* ---------- shelf ---------- */
let editingBook = null, armedDelete = null;
function shelfHTML() {
  const books = Object.values(state.books).sort((a, b) => (a.createdAt || "") < (b.createdAt || "") ? -1 : 1);
  const list = books.map(b => {
    const s = bookStats(b), pct = Math.round(s.read / b.count * 100);
    if (editingBook === b.id) return `
      <div class="book"><form class="stack" data-form="edit" data-id="${esc(b.id)}">
        <div class="field"><label class="f" for="eb-title">本の名前</label><input type="text" id="eb-title" name="title" value="${esc(b.title)}" required></div>
        <div class="field"><label class="f" for="eb-author">著者名（任意）</label><input type="text" id="eb-author" name="author" value="${esc(b.author || "")}"></div>
        <div class="field"><label class="f" for="eb-count">章の数</label><input type="number" id="eb-count" name="count" min="1" max="999" value="${b.count}" required></div>
        <div id="eb-msg" class="notice" hidden></div>
        <div class="row"><button class="btn primary" type="submit">保存</button><button class="btn" type="button" data-act="cancelEdit">やめる</button>
        <button class="btn danger" type="button" data-act="delBook" data-id="${esc(b.id)}">${armedDelete === b.id ? "もう一度押すと削除" : "この本を削除"}</button></div>
        ${armedDelete === b.id ? '<p class="small muted">この本の記入内容と写真がすべて消えます。必要なら先にノート画面からCSVを書き出してください。</p>' : ""}
      </form></div>`;
    return `
      <div class="book">
        <h3>${esc(b.title)}</h3>
        ${b.author ? `<div class="small muted">${esc(b.author)}</div>` : ""}
        <div class="small num">読了 ${s.read} / ${b.count}章 ・ ★${s.stars}${s.due ? ` ・ <span style="color:var(--shu)">復習 ${s.due}</span>` : ""}</div>
        <div class="bar"><span style="width:${pct}%"></span></div>
        <div class="row"><button class="btn primary" data-act="openBook" data-id="${esc(b.id)}">ノートを開く</button><button class="btn" data-act="editBook" data-id="${esc(b.id)}">編集</button></div>
      </div>`;
  }).join("");
  return `

/* ---------- photos ---------- */
function photoMsg(t) { const el = $("#photoMsg"); if (!el) return; el.textContent = t || ""; el.hidden = !t; }
async function shrink(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch {
    bmp = await new Promise((res, rej) => { const img = new Image(); const u = URL.createObjectURL(file); img.onload = () => res(img); img.onerror = () => rej(new Error("decode")); img.src = u; });
  }
  const w = bmp.width, h = bmp.height, s = Math.min(1, 1600 / Math.max(w, h));
  const cv = document.createElement("canvas"); cv.width = Math.round(w * s); cv.height = Math.round(h * s);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  return await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error("encode")), "image/jpeg", 0.85));
}
async function addPhotos(files) {
  if (!curE) return;
  files = Array.from(files || []).filter(f => !f.type || f.type.startsWith("image/") || /\.(heic|heif|jpe?g|png)$/i.test(f.name || ""));
  if (!files.length) { photoMsg("画像ファイルが見つかりませんでした。"); return; }
  const room = MAX_PHOTOS - curE.photos.length;
  const skipped = Math.max(0, files.length - room);
  files = files.slice(0, Math.max(0, room));
  const notes = [];
  if (skipped) notes.push(`写真は1章につき${MAX_PHOTOS}枚までです。${skipped}枚は追加しませんでした。`);
  photoMsg("写真を準備しています…");
  for (const f of files) {
    let blob;
    try { blob = await shrink(f); }
    catch { notes.push(/hei[cf]/i.test((f.type || "") + (f.name || "")) ? "HEIC形式の写真をこの環境で読めませんでした。カメラの設定を「互換性優先」にするか、スクリーンショットで追加してください。" : "読み込めない画像がありました。"); continue; }
    const id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    try { await idb.put("photos", id, blob); }
    catch { notes.push("写真を保存できませんでした。端末の空き容量を確認して、もう一度追加してください。"); continue; }
    blobCache.set(id, blob);
    curE.photos.push(id);
  }
  await saveEntryNow(curE);
  renderEditor();
  photoMsg([...new Set(notes)].join(" "));
}
async function getBlob(id) {

let modelList = null;
async function listModels(key) {

    return setTab("notes");
  }
  if (f.dataset.form === "edit") {
    const b = state.books[f.dataset.id]; if (!b) return;
    let maxUsed = 0; for (const e of Object.values(state.entries)) if (e.bookId === b.id && hasContent(e)) maxUsed = Math.max(maxUsed, e.no);
    if (count < maxUsed) { const m = $("#eb-msg"); m.textContent = `No.${pad3(maxUsed)}まで記入済みなので、章の数を${maxUsed}より少なくできません。`; m.hidden = false; return; }
    const nb = { ...b, title, author, count };
    try { await store.putBook(nb); } catch { msg("本を保存できませんでした。"); return; }
    state.books[b.id] = nb; editingBook = null; render();
  }
});
async function selectBook(id) {
  if (!state.books[id]) return;
  state.current = id; state.filter = "all";
  const b = { ...state.books[id], lastOpenedAt: new Date().toISOString() };
  state.books[id] = b;
  store.putBook(b).catch(() => {});
}
async function deleteBook(id) {
  const b = state.books[id]; if (!b) return;
  msg("削除しています…", "info");
  try {
    for (const [k, e] of Object.entries(state.entries)) {
      if (e.bookId !== id) continue;
      for (const p of e.photos || []) await idb.del("photos", p).catch(() => {});
      await store.delEntry(k); delete state.entries[k];
    }
    await store.delBook(id); delete state.books[id];
    if (state.current === id) state.current = Object.keys(state.books)[0] || null;
    msg("");
  } catch { msg("削除の途中で失敗しました。もう一度試してください。"); }
  editingBook = null; armedDelete = null; render();
}
window.addEventListener("pagehide", () => { if (curE && saveTimer) saveEntryNow(curE); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && curE && saveTimer) saveEntryNow(curE); });

/* ---------- start ---------- */
async function start() {
  try { const t = localStorage.getItem(LS + "-tab"); if (t) state.tab = t; } catch {}
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab ? "true" : "false"));
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  try { const d = await store.load(); state.books = d.books; state.entries = d.entries; Object.keys(d.entries).forEach(k => stored.add(k)); }
  catch { msg("記録を読み込めませんでした。ページを開き直してください。"); }
  const books = Object.values(state.books).sort((a, b) => (b.lastOpenedAt || "") > (a.lastOpenedAt || "") ? 1 : -1);
  state.current = books[0] ? books[0].id : null;
  if (!state.current) state.tab = "shelf";
  state.ready = true;
  setTab(state.tab);
}
start();
})();
</script>
